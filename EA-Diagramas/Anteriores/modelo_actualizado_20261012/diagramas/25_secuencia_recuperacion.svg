<svg xmlns="http://www.w3.org/2000/svg" width="1255" height="1475" viewBox="0 0 1255 1475"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#202020"><text x="627.5" y="32" text-anchor="middle" font-size="21">T07 Recuperar datos desde un respaldo</text><line x1="182.5" y1="120" x2="182.5" y2="1445" stroke="#999" stroke-dasharray="7 5"/><line x1="417.5" y1="120" x2="417.5" y2="1445" stroke="#999" stroke-dasharray="7 5"/><line x1="652.5" y1="120" x2="652.5" y2="1445" stroke="#999" stroke-dasharray="7 5"/><line x1="887.5" y1="120" x2="887.5" y2="1445" stroke="#999" stroke-dasharray="7 5"/><line x1="1122.5" y1="120" x2="1122.5" y2="1445" stroke="#999" stroke-dasharray="7 5"/><rect x="79.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="182.5" y="86" text-anchor="middle" font-size="15">Administrador</text><rect x="314.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="417.5" y="86" text-anchor="middle" font-size="15">FrmIntegridad</text><rect x="549.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="652.5" y="86" text-anchor="middle" font-size="15">IntegridadBLL</text><rect x="784.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="887.5" y="86" text-anchor="middle" font-size="15">IntegridadDAL</text><rect x="1019.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="1122.5" y="86" text-anchor="middle" font-size="15">Base auxiliar</text><text x="300" y="150" text-anchor="middle" font-size="15">1. Seleccionar .bak y confirmar</text><text x="300" y="170" text-anchor="middle" font-size="15">recuperación</text><line x1="182.5" y1="198" x2="417.5" y2="198" stroke="#333"  marker-end="url(#arrow)"/><text x="535" y="243" text-anchor="middle" font-size="15">2. Recuperar(ruta, tablasCompletas)</text><line x1="417.5" y1="271" x2="652.5" y2="271" stroke="#333"  marker-end="url(#arrow)"/><text x="770" y="316" text-anchor="middle" font-size="15">3. Recuperar(ruta,</text><text x="770" y="336" text-anchor="middle" font-size="15">restaurarTablasCompletas)</text><line x1="652.5" y1="364" x2="887.5" y2="364" stroke="#333"  marker-end="url(#arrow)"/><text x="1005" y="409" text-anchor="middle" font-size="15">4. Preparar copia accesible;</text><text x="1005" y="429" text-anchor="middle" font-size="15">restaurar y verificar respaldo</text><line x1="887.5" y1="457" x2="1122.5" y2="457" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="502" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="524" text-anchor="middle" font-size="15">Debe tener DVH y DVV válidos y el mismo IdBase</text><text x="887.5" y="570" text-anchor="middle" font-size="15">5. Transacción</text><text x="887.5" y="590" text-anchor="middle" font-size="15">Serializable y bloqueo</text><text x="887.5" y="610" text-anchor="middle" font-size="15">exclusivo</text><path d="M 887.5 638 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="683" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="705" text-anchor="middle" font-size="15">alt recuperación por registros</text><text x="887.5" y="751" text-anchor="middle" font-size="15">6. Restaurar filas</text><text x="887.5" y="771" text-anchor="middle" font-size="15">afectadas o eliminadas</text><text x="887.5" y="791" text-anchor="middle" font-size="15">desde el respaldo</text><path d="M 887.5 819 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="864" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="886" text-anchor="middle" font-size="15">Si no se conserva la referencia actual, rollback: respaldo insuficiente</text><rect x="80" y="932" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="954" text-anchor="middle" font-size="15">else restauración completa explícitamente confirmada</text><text x="887.5" y="1000" text-anchor="middle" font-size="15">7. Reemplazar tablas</text><text x="887.5" y="1020" text-anchor="middle" font-size="15">protegidas afectadas y</text><text x="887.5" y="1040" text-anchor="middle" font-size="15">sus controles</text><path d="M 887.5 1068 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="1113" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="1135" text-anchor="middle" font-size="15">Se descartan los cambios de esas tablas posteriores al respaldo</text><text x="887.5" y="1181" text-anchor="middle" font-size="15">8. Examinar; Commit solo</text><text x="887.5" y="1201" text-anchor="middle" font-size="15">si todo es correcto</text><path d="M 887.5 1229 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="652.5" y="1274" text-anchor="middle" font-size="15">9. InformeIntegridad correcto</text><line x1="887.5" y1="1302" x2="417.5" y2="1302" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="80" y="1347" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="1369" text-anchor="middle" font-size="15">Eliminar auxiliares; registrar recuperación fuera de la Bitacora protegida</text></g></svg>