<svg xmlns="http://www.w3.org/2000/svg" width="1255" height="1211" viewBox="0 0 1255 1211"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#202020"><text x="627.5" y="32" text-anchor="middle" font-size="21">T07 Crear y exportar respaldo comprobado</text><line x1="182.5" y1="120" x2="182.5" y2="1181" stroke="#999" stroke-dasharray="7 5"/><line x1="417.5" y1="120" x2="417.5" y2="1181" stroke="#999" stroke-dasharray="7 5"/><line x1="652.5" y1="120" x2="652.5" y2="1181" stroke="#999" stroke-dasharray="7 5"/><line x1="887.5" y1="120" x2="887.5" y2="1181" stroke="#999" stroke-dasharray="7 5"/><line x1="1122.5" y1="120" x2="1122.5" y2="1181" stroke="#999" stroke-dasharray="7 5"/><rect x="79.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="182.5" y="86" text-anchor="middle" font-size="15">Administrador</text><rect x="314.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="417.5" y="86" text-anchor="middle" font-size="15">FrmIntegridad</text><rect x="549.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="652.5" y="86" text-anchor="middle" font-size="15">IntegridadBLL</text><rect x="784.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="887.5" y="86" text-anchor="middle" font-size="15">IntegridadDAL</text><rect x="1019.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="1122.5" y="86" text-anchor="middle" font-size="15">Base auxiliar</text><text x="300" y="150" text-anchor="middle" font-size="15">1. Crear respaldo; elegir archivo</text><text x="300" y="170" text-anchor="middle" font-size="15">.bak</text><line x1="182.5" y1="198" x2="417.5" y2="198" stroke="#333"  marker-end="url(#arrow)"/><text x="535" y="243" text-anchor="middle" font-size="15">2. CrearRespaldoConfiable(destino)</text><line x1="417.5" y1="271" x2="652.5" y2="271" stroke="#333"  marker-end="url(#arrow)"/><text x="770" y="316" text-anchor="middle" font-size="15">3. CrearRespaldoConfiable(destino)</text><line x1="652.5" y1="344" x2="887.5" y2="344" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="389" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="411" text-anchor="middle" font-size="15">Exigir permisos; verificar estado actual; no sobrescribir archivos existentes</text><text x="887.5" y="457" text-anchor="middle" font-size="15">4.</text><text x="887.5" y="477" text-anchor="middle" font-size="15">PrepararCarpetaCompartid</text><text x="887.5" y="497" text-anchor="middle" font-size="15">a; BACKUP COPY_ONLY</text><text x="887.5" y="517" text-anchor="middle" font-size="15">CHECKSUM</text><path d="M 887.5 545 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="1005" y="590" text-anchor="middle" font-size="15">5. RESTORE VERIFYONLY y</text><text x="1005" y="610" text-anchor="middle" font-size="15">restauración con MOVE</text><line x1="887.5" y1="638" x2="1122.5" y2="638" stroke="#333"  marker-end="url(#arrow)"/><text x="1005" y="683" text-anchor="middle" font-size="15">6. Examinar DVH y DVV del respaldo</text><line x1="887.5" y1="711" x2="1122.5" y2="711" stroke="#333"  marker-end="url(#arrow)"/><text x="1005" y="756" text-anchor="middle" font-size="15">7. Integridad correcta</text><line x1="1122.5" y1="784" x2="887.5" y2="784" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="887.5" y="829" text-anchor="middle" font-size="15">8. Eliminar base</text><text x="887.5" y="849" text-anchor="middle" font-size="15">auxiliar;</text><text x="887.5" y="869" text-anchor="middle" font-size="15">ExportarRespaldo</text><path d="M 887.5 897 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="942" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="964" text-anchor="middle" font-size="15">Copiar con permisos del usuario; comparar SHA-256 del archivo; finalizar .bak</text><text x="652.5" y="1010" text-anchor="middle" font-size="15">9. Ruta del respaldo comprobado</text><line x1="887.5" y1="1038" x2="417.5" y2="1038" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="80" y="1083" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="1105" text-anchor="middle" font-size="15">Si falla la exportación, conservar copia local e informar su ruta</text></g></svg>