<text x="1231.5" y="960" text-anchor="middle" fill="#805b00" font-family="Segoe UI, sans-serif" font-size="20">[por cada hijo devuelto]</text>
<text x="420" y="1012" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="22">6. CargarNodosRecursivo(nodoPermiso, hijo)</text>
