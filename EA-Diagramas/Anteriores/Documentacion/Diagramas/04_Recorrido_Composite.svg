<text x="1265.0" y="751" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="20">CargarNodosRecursivo crea el nodo del permiso y lo agrega al nodo padre.</text>
<text x="1230.0" y="817" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="22">4. ObtenerHijos()</text>
