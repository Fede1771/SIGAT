<text x="1265.0" y="280" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="20">Entrada: CargarRol(nodos:TreeNodeCollection, rol:Rol).</text>
<text x="1265.0" y="310" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="20">Este mismo recorrido se usa en catálogo y permisos asignados al usuario.</text>
<rect x="150" y="353" width="2230" height="60" fill="#fff9e8" stroke="#e6ae19" stroke-width="2"/>
<text x="1265.0" y="388" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="20">CargarRol crea TreeNode(rol.Nombre) y lo agrega a nodos.</text>
<text x="690.0" y="454" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="22">1. Permisos {get}</text>
