<svg xmlns="http://www.w3.org/2000/svg" width="1255" height="990" viewBox="0 0 1255 990"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#202020"><text x="627.5" y="32" text-anchor="middle" font-size="21">Restaurar el idioma propio al iniciar sesión</text><line x1="182.5" y1="120" x2="182.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="417.5" y1="120" x2="417.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="652.5" y1="120" x2="652.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="887.5" y1="120" x2="887.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="1122.5" y1="120" x2="1122.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><rect x="79.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="182.5" y="86" text-anchor="middle" font-size="15">FrmPrincipal</text><rect x="314.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="417.5" y="86" text-anchor="middle" font-size="15">IdiomaBLL</text><rect x="549.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="652.5" y="86" text-anchor="middle" font-size="15">SesionServicio</text><rect x="784.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="887.5" y="86" text-anchor="middle" font-size="15">IdiomaDAL</text><rect x="1019.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="1122.5" y="86" text-anchor="middle" font-size="15">IdiomaManager</text><text x="652.5" y="150" text-anchor="middle" font-size="15">1. Suscribir(this)</text><line x1="182.5" y1="178" x2="1122.5" y2="178" stroke="#333"  marker-end="url(#arrow)"/><text x="300" y="223" text-anchor="middle" font-size="15">2. RestablecerIdiomaUsuario()</text><line x1="182.5" y1="251" x2="417.5" y2="251" stroke="#333"  marker-end="url(#arrow)"/><text x="535" y="296" text-anchor="middle" font-size="15">3. Leer UsuarioActual.IdUsuario</text><line x1="417.5" y1="324" x2="652.5" y2="324" stroke="#333"  marker-end="url(#arrow)"/><text x="652.5" y="369" text-anchor="middle" font-size="15">4. ObtenerIdiomas() y ObtenerIdiomaPreferido(idUsuario)</text><line x1="417.5" y1="397" x2="887.5" y2="397" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="442" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="464" text-anchor="middle" font-size="15">Elegir preferido activo; si no, español activo o primer idioma activo</text><text x="417.5" y="510" text-anchor="middle" font-size="15">5. CargarIdioma(id,</text><text x="417.5" y="530" text-anchor="middle" font-size="15">guardarPreferencia:</text><text x="417.5" y="550" text-anchor="middle" font-size="15">false)</text><path d="M 417.5 578 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="652.5" y="623" text-anchor="middle" font-size="15">6. ObtenerIdiomaPorId y ObtenerTraduccionesPorIdioma</text><line x1="417.5" y1="651" x2="887.5" y2="651" stroke="#333"  marker-end="url(#arrow)"/><text x="770" y="696" text-anchor="middle" font-size="15">7. CargarIdioma(idioma, diccionario)</text><line x1="417.5" y1="724" x2="1122.5" y2="724" stroke="#333"  marker-end="url(#arrow)"/><text x="1122.5" y="769" text-anchor="middle" font-size="15">8.</text><text x="1122.5" y="789" text-anchor="middle" font-size="15">NotificarObservadores()</text><path d="M 1122.5 817 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="862" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="884" text-anchor="middle" font-size="15">El idioma alternativo no reemplaza la preferencia guardada si esta está inactiva</text></g></svg>