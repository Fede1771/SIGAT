e" font-size="15">Asignar rol</text><line x1="182.5" y1="198" x2="417.5" y2="198" stroke="#333"  marker-end="url(#arrow)"/><text x="417.5" y="243" text-anchor="middle" font-size="15">2.</text><text x="417.5" y="263" text-anchor="middle" font-size="15">Ejecutar(AsignarAUsuario</text><text x="417.5" y="283" text-anchor="middle" font-size="15">)</text><path d="M 417.5 311 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="535" y="356" text-anchor="middle" font-size="15">3. AsignarRol(rol)</text><line x1="417.5" y1="384" x2="652.5" y2="384" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="429" width="1330" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="745" y="451" text-anchor="middle" font-size="15">AsignarRol ignora la misma referencia si ya está asignada</text><text x="652.5" y="497" text-anchor="middle" font-size="15">4. Guardar(estado)</text><line x1="417.5" y1="525" x2="887.5" y2="525" stroke="#333"  marker-end="url(#arrow)"/><text x="1005" y="570" text-anchor="middle" font-size="15">5. Cargar() para validar</text><text x="1005" y="590" text-anchor="middle" font-size="15">autorización actual</text><line x1="887.5" y1="618" x2="1122.5" y2="618" stroke="#333"  marker-end="url(#arrow)"/><text x="887.5" y="663" text-anchor="middle" font-size="15">6. ExigirGestion y</text><text x="887.5" y="683" text-anchor="middle" font-size="15">Validar(estado)</text><path d="M 887.5 711 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="1122.5" y="756" text-anchor="middle" font-size="15">7. ValidarCatalogo(estado)</text><line x1="887.5" y1="784" x2="1357.5" y2="784" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="829" width="1330" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="745" y="851" text-anchor="middle" font-size="15">No ciclos; administrador original protegido; debe quedar un administrador activo</text><text x="1005" y="897" text-anchor="middle" font-size="15">8. Guardar(estado)</text><line x1="887.5" y1="925" x2="1122.5" y2="925" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="970" width="1330" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="745" y="992" text-anchor="middle" font-size="15">Transacción y comparación de SeguridadVersion; si cambió, se cancela</text><text x="417.5" y="1038" text-anchor="middle" font-size="15">9. RefrescarArboles()</text><path d="M 417.5 1066 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="1111" width="1330" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="745" y="1133" text-anchor="middle" font-size="15">Los permisos de sesiones ya abiertas se actualizan al volver a iniciar sesión</text></g></svg>