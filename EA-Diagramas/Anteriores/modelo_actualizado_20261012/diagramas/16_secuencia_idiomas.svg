 y="824" text-anchor="middle" font-size="15">NotificarObservadores()</text><path d="M 1122.5 852 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="897" width="1565" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="862.5" y="919" text-anchor="middle" font-size="15">loop por cada IIdiomaObserver suscrito</text><text x="1240" y="965" text-anchor="middle" font-size="15">8. ActualizarIdioma()</text><line x1="1122.5" y1="993" x2="1357.5" y2="993" stroke="#333"  marker-end="url(#arrow)"/><text x="1475" y="1038" text-anchor="middle" font-size="15">9. TraducirFormulario(this)</text><line x1="1357.5" y1="1066" x2="1592.5" y2="1066" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="1111" width="1565" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="862.5" y="1133" text-anchor="middle" font-size="15">Recorrer Tags de título, controles, menús y columnas; registrar claves nuevas</text><text x="1357.5" y="1179" text-anchor="middle" font-size="15">10. Traducir(form, clave, textoOriginal)</text><line x1="1592.5" y1="1207" x2="1122.5" y2="1207" stroke="#333"  marker-end="url(#arrow)"/><text x="1357.5" y="1252" text-anchor="middle" font-size="15">11. Traducción o texto recibido como respaldo</text><line x1="1122.5" y1="1280" x2="1592.5" y2="1280" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="80" y="1325" width="1565" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="862.5" y="1347" text-anchor="middle" font-size="15">No existe FrmBase ni GestorIdioma en el código actual</text></g></svg>