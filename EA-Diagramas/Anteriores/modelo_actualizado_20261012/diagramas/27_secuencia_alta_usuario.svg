<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="990" viewBox="0 0 1490 990"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#202020"><text x="745" y="32" text-anchor="middle" font-size="21">Crear una cuenta y registrar su alta</text><line x1="182.5" y1="120" x2="182.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="417.5" y1="120" x2="417.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="652.5" y1="120" x2="652.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="887.5" y1="120" x2="887.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="1122.5" y1="120" x2="1122.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><line x1="1357.5" y1="120" x2="1357.5" y2="960" stroke="#999" stroke-dasharray="7 5"/><rect x="79.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="182.5" y="86" text-anchor="middle" font-size="15">Administrador</text><rect x="314.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="417.5" y="86" text-anchor="middle" font-size="15">FrmGestionUsuarios</text><rect x="549.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="652.5" y="86" text-anchor="middle" font-size="15">UsuarioBLL</text><rect x="784.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="887.5" y="86" text-anchor="middle" font-size="15">UsuarioDAL</text><rect x="1019.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="1122.5" y="86" text-anchor="middle" font-size="15">HashHelper</text><rect x="1254.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="1357.5" y="86" text-anchor="middle" font-size="15">BitacoraBLL</text><text x="300" y="150" text-anchor="middle" font-size="15">1. Completar usuario, nombre,</text><text x="300" y="170" text-anchor="middle" font-size="15">apellido y contraseña</text><line x1="182.5" y1="198" x2="417.5" y2="198" stroke="#333"  marker-end="url(#arrow)"/><text x="535" y="243" text-anchor="middle" font-size="15">2. CrearUsuario(usuario,</text><text x="535" y="263" text-anchor="middle" font-size="15">passwordPlana)</text><line x1="417.5" y1="291" x2="652.5" y2="291" stroke="#333"  marker-end="url(#arrow)"/><text x="652.5" y="336" text-anchor="middle" font-size="15">3. ValidarDatos(usuario)</text><path d="M 652.5 364 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="770" y="409" text-anchor="middle" font-size="15">4. ObtenerPorNombreUsuario(nombre)</text><line x1="652.5" y1="437" x2="887.5" y2="437" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="482" width="1330" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="745" y="504" text-anchor="middle" font-size="15">Nombre único y campos obligatorios; si no, cancelar</text><text x="887.5" y="550" text-anchor="middle" font-size="15">5. ObtenerHashSHA256(passwordPlana)</text><line x1="652.5" y1="578" x2="1122.5" y2="578" stroke="#333"  marker-end="url(#arrow)"/><text x="770" y="623" text-anchor="middle" font-size="15">6. Insertar(usuario)</text><line x1="652.5" y1="651" x2="887.5" y2="651" stroke="#333"  marker-end="url(#arrow)"/><text x="1005" y="696" text-anchor="middle" font-size="15">7. Registrar(evento de GestionUsuariosFactory(AltaUsuario))</text><line x1="652.5" y1="724" x2="1357.5" y2="724" stroke="#333"  marker-end="url(#arrow)"/><text x="417.5" y="769" text-anchor="middle" font-size="15">8. Limpiar();</text><text x="417.5" y="789" text-anchor="middle" font-size="15">CargarGrilla()</text><path d="M 417.5 817 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="862" width="1330" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="745" y="884" text-anchor="middle" font-size="15">La escritura de Usuarios y su auditoría son operaciones separadas en el código</text></g></svg