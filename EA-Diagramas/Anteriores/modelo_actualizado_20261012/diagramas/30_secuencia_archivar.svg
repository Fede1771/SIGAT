<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="977" viewBox="0 0 1100 977"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#202020"><text x="550" y="32" text-anchor="middle" font-size="21">Archivar bitácora manteniendo el DVV</text><line x1="182.5" y1="120" x2="182.5" y2="947" stroke="#999" stroke-dasharray="7 5"/><line x1="417.5" y1="120" x2="417.5" y2="947" stroke="#999" stroke-dasharray="7 5"/><line x1="652.5" y1="120" x2="652.5" y2="947" stroke="#999" stroke-dasharray="7 5"/><line x1="887.5" y1="120" x2="887.5" y2="947" stroke="#999" stroke-dasharray="7 5"/><rect x="79.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="182.5" y="86" text-anchor="middle" font-size="15">Administrador</text><rect x="314.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="417.5" y="86" text-anchor="middle" font-size="15">FrmIntegridad</text><rect x="549.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="652.5" y="86" text-anchor="middle" font-size="15">IntegridadBLL</text><rect x="784.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="887.5" y="86" text-anchor="middle" font-size="15">IntegridadDAL</text><text x="300" y="150" text-anchor="middle" font-size="15">1. Archivar bitácora antigua y</text><text x="300" y="170" text-anchor="middle" font-size="15">confirmar</text><line x1="182.5" y1="198" x2="417.5" y2="198" stroke="#333"  marker-end="url(#arrow)"/><text x="535" y="243" text-anchor="middle" font-size="15">2. ArchivarBitacora(180)</text><line x1="417.5" y1="271" x2="652.5" y2="271" stroke="#333"  marker-end="url(#arrow)"/><text x="770" y="316" text-anchor="middle" font-size="15">3. ArchivarBitacora(180)</text><line x1="652.5" y1="344" x2="887.5" y2="344" stroke="#333"  marker-end="url(#arrow)"/><text x="887.5" y="389" text-anchor="middle" font-size="15">4. ExigirAdministrador;</text><text x="887.5" y="409" text-anchor="middle" font-size="15">Cambiar(&quot;Bitacora&quot;,</text><text x="887.5" y="429" text-anchor="middle" font-size="15">comando)</text><path d="M 887.5 457 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="502" width="940" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="550" y="524" text-anchor="middle" font-size="15">Verificación inicial y bloqueo exclusivo dentro de una transacción</text><text x="887.5" y="570" text-anchor="middle" font-size="15">5. DELETE OUTPUT INTO</text><text x="887.5" y="590" text-anchor="middle" font-size="15">Bitacora_Historico para</text><text x="887.5" y="610" text-anchor="middle" font-size="15">fecha anterior al límite</text><path d="M 887.5 638 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="887.5" y="683" text-anchor="middle" font-size="15">6. ActualizarVertical;</text><text x="887.5" y="703" text-anchor="middle" font-size="15">Examinar; Commit</text><path d="M 887.5 731 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="652.5" y="776" text-anchor="middle" font-size="15">7. Cantidad de eventos archivados</text><line x1="887.5" y1="804" x2="417.5" y2="804" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="80" y="849" width="940" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="550" y="871" text-anchor="middle" font-size="15">Bitacora_Historico se crea cuando se usa; no tiene DVV propio</text></g></svg>