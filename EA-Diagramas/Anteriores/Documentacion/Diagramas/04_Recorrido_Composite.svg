<rect x="150" y="1619" width="2230" height="120" fill="#fff9e8" stroke="#e6ae19" stroke-width="2"/>
<text x="1265.0" y="1654" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="20">PermisoSimple devuelve una lista vacía; PermisoCompuesto devuelve sus hijos.</text>
<text x="1265.0" y="1684" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="20">El código no usa un if de tipo para decidir si recorre hijos.</text>
<text x="1265.0" y="1714" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="20">La consulta a Permiso se resuelve por polimorfismo.</text>
