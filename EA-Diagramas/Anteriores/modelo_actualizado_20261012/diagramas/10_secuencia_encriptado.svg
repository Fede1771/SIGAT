<svg xmlns="http://www.w3.org/2000/svg" width="1255" height="922" viewBox="0 0 1255 922"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#202020"><text x="627.5" y="32" text-anchor="middle" font-size="21">T03 Cifrado al registrar bitácora</text><line x1="182.5" y1="120" x2="182.5" y2="892" stroke="#999" stroke-dasharray="7 5"/><line x1="417.5" y1="120" x2="417.5" y2="892" stroke="#999" stroke-dasharray="7 5"/><line x1="652.5" y1="120" x2="652.5" y2="892" stroke="#999" stroke-dasharray="7 5"/><line x1="887.5" y1="120" x2="887.5" y2="892" stroke="#999" stroke-dasharray="7 5"/><line x1="1122.5" y1="120" x2="1122.5" y2="892" stroke="#999" stroke-dasharray="7 5"/><rect x="79.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="182.5" y="86" text-anchor="middle" font-size="15">BitacoraBLL</text><rect x="314.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="417.5" y="86" text-anchor="middle" font-size="15">BitacoraDAL</text><rect x="549.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="652.5" y="86" text-anchor="middle" font-size="15">IntegridadDAL</text><rect x="784.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="887.5" y="86" text-anchor="middle" font-size="15">EncriptadorServicio</text><rect x="1019.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="1122.5" y="86" text-anchor="middle" font-size="15">VerificadorSHA256</text><text x="300" y="150" text-anchor="middle" font-size="15">1. Insertar(registro)</text><line x1="182.5" y1="178" x2="417.5" y2="178" stroke="#333"  marker-end="url(#arrow)"/><text x="535" y="223" text-anchor="middle" font-size="15">2. Cambiar(&quot;Bitacora&quot;, comando)</text><line x1="417.5" y1="251" x2="652.5" y2="251" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="296" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="318" text-anchor="middle" font-size="15">Transacción Serializable y bloqueo exclusivo; validar DVH y DVV antes</text><text x="652.5" y="364" text-anchor="middle" font-size="15">3. Encriptar(InformacionAsociada)</text><line x1="417.5" y1="392" x2="887.5" y2="392" stroke="#333"  marker-end="url(#arrow)"/><text x="652.5" y="437" text-anchor="middle" font-size="15">4. AES CBC con PKCS7, representado en Base64</text><line x1="887.5" y1="465" x2="417.5" y2="465" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="417.5" y="510" text-anchor="middle" font-size="15">5. INSERT y obtener</text><text x="417.5" y="530" text-anchor="middle" font-size="15">IdBitacora</text><path d="M 417.5 558 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="887.5" y="603" text-anchor="middle" font-size="15">6. Bitacora(id, fecha SQL, usuario, actividad, cifrado)</text><line x1="652.5" y1="631" x2="1122.5" y2="631" stroke="#333"  marker-end="url(#arrow)"/><text x="652.5" y="676" text-anchor="middle" font-size="15">7. GuardarHash y</text><text x="652.5" y="696" text-anchor="middle" font-size="15">ActualizarVertical</text><path d="M 652.5 724 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="652.5" y="769" text-anchor="middle" font-size="15">8. Examinar; Commit solo</text><text x="652.5" y="789" text-anchor="middle" font-size="15">si es correcta</text><path d="M 652.5 817 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/></g></svg>