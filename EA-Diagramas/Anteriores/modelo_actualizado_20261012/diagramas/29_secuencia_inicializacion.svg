<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1123" viewBox="0 0 1100 1123"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#202020"><text x="550" y="32" text-anchor="middle" font-size="21">Preparación inicial de integridad</text><line x1="182.5" y1="120" x2="182.5" y2="1093" stroke="#999" stroke-dasharray="7 5"/><line x1="417.5" y1="120" x2="417.5" y2="1093" stroke="#999" stroke-dasharray="7 5"/><line x1="652.5" y1="120" x2="652.5" y2="1093" stroke="#999" stroke-dasharray="7 5"/><line x1="887.5" y1="120" x2="887.5" y2="1093" stroke="#999" stroke-dasharray="7 5"/><rect x="79.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="182.5" y="86" text-anchor="middle" font-size="15">Administrador SQL</text><rect x="314.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="417.5" y="86" text-anchor="middle" font-size="15">FrmIntegridad</text><rect x="549.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="652.5" y="86" text-anchor="middle" font-size="15">IntegridadBLL</text><rect x="784.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="887.5" y="86" text-anchor="middle" font-size="15">IntegridadDAL</text><text x="300" y="150" text-anchor="middle" font-size="15">1. Confirmar referencia inicial</text><text x="300" y="170" text-anchor="middle" font-size="15">confiable</text><line x1="182.5" y1="198" x2="417.5" y2="198" stroke="#333"  marker-end="url(#arrow)"/><text x="535" y="243" text-anchor="middle" font-size="15">2. InicializarBaseConfiable()</text><line x1="417.5" y1="271" x2="652.5" y2="271" stroke="#333"  marker-end="url(#arrow)"/><text x="770" y="316" text-anchor="middle" font-size="15">3. InicializarBaseConfiable()</text><line x1="652.5" y1="344" x2="887.5" y2="344" stroke="#333"  marker-end="url(#arrow)"/><rect x="80" y="389" width="940" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="550" y="411" text-anchor="middle" font-size="15">Exigir permisos y rechazar si ya hay controles inicializados</text><text x="887.5" y="457" text-anchor="middle" font-size="15">4.</text><text x="887.5" y="477" text-anchor="middle" font-size="15">CrearArchivoBackup(&quot;ante</text><text x="887.5" y="497" text-anchor="middle" font-size="15">s_integridad&quot;)</text><path d="M 887.5 525 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="887.5" y="570" text-anchor="middle" font-size="15">5. Transacción;</text><text x="887.5" y="590" text-anchor="middle" font-size="15">ValidarLegado por fila</text><path d="M 887.5 618 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="663" width="940" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="550" y="685" text-anchor="middle" font-size="15">Discrepancias no reconocidas cancelan; solo compatibilidad de redondeo documentada</text><text x="887.5" y="731" text-anchor="middle" font-size="15">6. GuardarHash; crear</text><text x="887.5" y="751" text-anchor="middle" font-size="15">DVV con IdBase nuevo</text><path d="M 887.5 779 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="887.5" y="824" text-anchor="middle" font-size="15">7. Examinar; Commit</text><path d="M 887.5 852 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="887.5" y="897" text-anchor="middle" font-size="15">8.</text><text x="887.5" y="917" text-anchor="middle" font-size="15">CrearRespaldoConfiable()</text><path d="M 887.5 945 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="652.5" y="990" text-anchor="middle" font-size="15">9. Ruta del respaldo final comprobado</text><line x1="887.5" y1="1018" x2="417.5" y2="1018" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/></g></svg>