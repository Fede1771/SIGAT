<text x="420" y="649" text-anchor="middle" fill="#20262e" font-family="Segoe UI, sans-serif" font-size="22">3. CargarNodosRecursivo(nodo, permiso)</text>
<line x1="150.0" y1="670" x2="215.0" y2="670" stroke="#757f8a" stroke-width="2"/>
