<svg xmlns="http://www.w3.org/2000/svg" width="1255" height="1236" viewBox="0 0 1255 1236"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#202020"><text x="627.5" y="32" text-anchor="middle" font-size="21">T07 Verificar y bloquear datos alterados</text><line x1="182.5" y1="120" x2="182.5" y2="1206" stroke="#999" stroke-dasharray="7 5"/><line x1="417.5" y1="120" x2="417.5" y2="1206" stroke="#999" stroke-dasharray="7 5"/><line x1="652.5" y1="120" x2="652.5" y2="1206" stroke="#999" stroke-dasharray="7 5"/><line x1="887.5" y1="120" x2="887.5" y2="1206" stroke="#999" stroke-dasharray="7 5"/><line x1="1122.5" y1="120" x2="1122.5" y2="1206" stroke="#999" stroke-dasharray="7 5"/><rect x="79.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="182.5" y="86" text-anchor="middle" font-size="15">Program / FrmIntegridad</text><rect x="314.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="417.5" y="86" text-anchor="middle" font-size="15">IntegridadBLL</text><rect x="549.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="652.5" y="86" text-anchor="middle" font-size="15">IntegridadDAL</text><rect x="784.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="887.5" y="86" text-anchor="middle" font-size="15">VerificadorSHA256</text><rect x="1019.5" y="65" width="206" height="55" fill="#edf2f7" stroke="#555"/><text x="1122.5" y="86" text-anchor="middle" font-size="15">EncriptadorServicio</text><text x="300" y="150" text-anchor="middle" font-size="15">1. Verificar()</text><line x1="182.5" y1="178" x2="417.5" y2="178" stroke="#333"  marker-end="url(#arrow)"/><text x="535" y="223" text-anchor="middle" font-size="15">2. Verificar()</text><line x1="417.5" y1="251" x2="652.5" y2="251" stroke="#333"  marker-end="url(#arrow)"/><text x="652.5" y="296" text-anchor="middle" font-size="15">3. Transacción</text><text x="652.5" y="316" text-anchor="middle" font-size="15">Serializable; bloqueo</text><text x="652.5" y="336" text-anchor="middle" font-size="15">compartido; Examinar</text><path d="M 652.5 364 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><rect x="80" y="409" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="431" text-anchor="middle" font-size="15">loop Bitacora y Traduccion, ordenadas por sus claves</text><text x="770" y="477" text-anchor="middle" font-size="15">4. Recalcular SHA-256 de cada fila</text><text x="770" y="497" text-anchor="middle" font-size="15">(DVH)</text><line x1="652.5" y1="525" x2="887.5" y2="525" stroke="#333"  marker-end="url(#arrow)"/><text x="652.5" y="570" text-anchor="middle" font-size="15">5. Comparar DVH</text><text x="652.5" y="590" text-anchor="middle" font-size="15">calculado con guardado</text><path d="M 652.5 618 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="887.5" y="663" text-anchor="middle" font-size="15">6. Desencriptar para comprobar el cifrado de Bitacora</text><line x1="652.5" y1="691" x2="1122.5" y2="691" stroke="#333"  marker-end="url(#arrow)"/><text x="770" y="736" text-anchor="middle" font-size="15">7.</text><text x="770" y="756" text-anchor="middle" font-size="15">Hexadecimal(Canonico(tabla,cantidad</text><text x="770" y="776" text-anchor="middle" font-size="15">) + claves y hashes)</text><line x1="652.5" y1="804" x2="887.5" y2="804" stroke="#333"  marker-end="url(#arrow)"/><text x="652.5" y="849" text-anchor="middle" font-size="15">8. Comparar DVV,</text><text x="652.5" y="869" text-anchor="middle" font-size="15">cantidad, Version e</text><text x="652.5" y="889" text-anchor="middle" font-size="15">IdBase</text><path d="M 652.5 917 h 55 v 24 h -55" fill="none" stroke="#333" marker-end="url(#arrow)"/><text x="535" y="962" text-anchor="middle" font-size="15">9. InformeIntegridad con Problemas</text><line x1="652.5" y1="990" x2="417.5" y2="990" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="300" y="1035" text-anchor="middle" font-size="15">10. InformeIntegridad</text><line x1="417.5" y1="1063" x2="182.5" y2="1063" stroke="#333" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="80" y="1108" width="1095" height="42" fill="#f7f7ed" stroke="#aaa"/><text x="627.5" y="1130" text-anchor="middle" font-size="15">Correcta = Configurada y sin problemas. Si falla el inicio, abrir recuperación y bloquear login</text></g></svg>